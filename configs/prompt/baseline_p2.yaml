# Opt-in P2 few-shot extension of baseline P1 response-option rules.
name: baseline_p2

quality_checker:
  template_path: ${paths.prompt_dir}/agents/baseline_p2/quality_checker.md
  max_retries: 3
  timeout_seconds: 120

item_reviser:
  template_path: ${paths.prompt_dir}/agents/baseline_p2/item_reviser.md
  max_retries: 3
  timeout_seconds: 120

